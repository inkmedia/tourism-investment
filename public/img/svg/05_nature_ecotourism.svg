<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
 role="img" aria-labelledby="title desc">
  <title id="title">Nature &amp; Eco-Tourism premium icon</title>
  <desc id="desc">Editable vector icon with separately grouped elements for CSS, JavaScript, GSAP or SVG animation workflows.</desc>
  <style>
    :root {
      --ink: #24222B;
      --accent: #C99A43;
    }
    .ink {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .accent {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .accent-fill { fill: var(--accent); }
    .ink-fill { fill: var(--ink); }
  </style>
