      <path class="ink" d="M31.5 46C24 46 18.5 41.5 17 34C24.5 34 30 38.5 31.5 46Z"/>
    </g>
    <g id="lotus-right" data-part="lotus-right">
      <path class="ink" d="M32.5 46C40 46 45.5 41.5 47 34C39.5 34 34 38.5 32.5 46Z"/>
    </g>
    <g id="lotus-center" data-part="lotus-center">
      <path class="accent" d="M32 46C26.5 40.5 26.5 33 32 28C37.5 33 37.5 40.5 32 46Z"/>
